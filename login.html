<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <form >
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>

    

</body>
</html>
